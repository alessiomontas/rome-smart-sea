<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rome Smart Sea</title>
<meta name="description" content="La guida dell'appartamento Rome Smart Sea — Via delle Rande 6, Edificio A, Interno 8, Lido di Ostia.">
<meta name="theme-color" content="#1A1713">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* ═══════════ fondamenta ═══════════ */
:root{
  --shell:#1A1713; --surface:#FBF8F3; --surface-2:#F3EEE4;
  --ink:#2B251E; --ink-2:#6E6355; --ink-3:#A2988A;
  --hair:#E8E1D4; --hair-2:#F0EADE;
  --gold:#A8843F; --gold-lit:#C9A769; --gold-wash:#F6EFDE;
  --sage:#6F7D66; --terra:#A3493A;
  --tessera:#EFE7D7; --tessera-ink:#2B251E; --tessera-ink-2:#80745F;
  --tessera-filo:#DFD3BC; --ico:#C4B192; --tessera-segno:#FDFAF4;
  --glass:rgba(26,23,19,.76);
  --wifi-bg:#2B251E; --wifi-fg:#FBF8F3;
  --morbida:0 1px 2px rgba(43,37,30,.04),0 10px 30px rgba(43,37,30,.07);
  --disp:"Marcellus",Georgia,serif;
  --ui:"Manrope",-apple-system,"Segoe UI",sans-serif;
  --col:520px; --gut:22px; --tondo:20px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --surface:#1D1A15; --surface-2:#262118;
    --ink:#F4EFE5; --ink-2:#C0B5A3; --ink-3:#8C8273;
    --hair:#342D23; --hair-2:#2A241B;
    --gold:#CFAC67; --gold-lit:#E0C38A; --gold-wash:#2C2518;
    --sage:#93A189; --terra:#DA8571;
    --wifi-bg:#262118; --wifi-fg:#F4EFE5;
    --morbida:0 1px 2px rgba(0,0,0,.4),0 12px 36px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --surface:#1D1A15; --surface-2:#262118;
  --ink:#F4EFE5; --ink-2:#C0B5A3; --ink-3:#8C8273;
  --hair:#342D23; --hair-2:#2A241B;
  --gold:#CFAC67; --gold-lit:#E0C38A; --gold-wash:#2C2518;
  --sage:#93A189; --terra:#DA8571;
  --wifi-bg:#262118; --wifi-fg:#F4EFE5;
  --morbida:0 1px 2px rgba(0,0,0,.4),0 12px 36px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{margin:0;background:var(--shell);color:var(--ink);font-family:var(--ui);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
body.fermo{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;font-family:var(--ui)}
img,video{display:block}
:focus-visible{outline:1.5px solid var(--gold);outline-offset:3px;border-radius:4px}

/* ═══════════ lo sfondo ═══════════ */
.backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--shell)}
.backdrop figure{position:absolute;inset:0;margin:0;background-size:cover;
  background-position:50% 44%;opacity:1;animation:piano 33s infinite}
.backdrop figure:nth-child(2){animation:alterna 33s infinite 11s;background-position:50% 56%}
.backdrop figure:nth-child(3){animation:alterna 33s infinite 22s;background-position:50% 50%}
@keyframes piano{
  0%{transform:scale(1.02)} 50%{transform:scale(1.08)} 100%{transform:scale(1.02)}
}
@keyframes alterna{
  0%{opacity:0;transform:scale(1.02)} 6%{opacity:1}
  27%{opacity:1;transform:scale(1.08)} 33%{opacity:0;transform:scale(1.085)}
  100%{opacity:0;transform:scale(1.02)}
}
.veil{position:absolute;inset:0;
  background:linear-gradient(178deg,rgba(26,23,19,.5) 0%,rgba(26,23,19,.12) 30%,
    rgba(26,23,19,.46) 64%,rgba(26,23,19,.92) 100%)}
@media (prefers-reduced-motion:reduce){
  .backdrop figure{animation:none;opacity:0} .backdrop figure:nth-child(1){opacity:1}
}

/* ═══════════ barra alta ═══════════ */
.top{position:fixed;top:0;left:0;right:0;z-index:40;background:transparent;
  transition:background .35s ease,border-color .35s ease;border-bottom:1px solid transparent}
.top.posata{background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(1.3) blur(16px);-webkit-backdrop-filter:saturate(1.3) blur(16px);
  border-bottom-color:var(--hair)}
.top-in{max-width:var(--col);margin:0 auto;padding:12px var(--gut);
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.sigla{font-family:var(--disp);font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;
  color:#F4EFE5;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.55)}
.top.posata .sigla{color:var(--ink);text-shadow:none}
.langs{display:flex;gap:1px;background:rgba(244,239,229,.14);padding:2px;border-radius:999px}
.langs button{font-size:10.5px;font-weight:700;letter-spacing:.08em;background:none;border:0;
  color:rgba(244,239,229,.74);padding:5px 8px;cursor:pointer;border-radius:999px;
  transition:background .25s,color .25s}
.langs button[aria-current="true"]{background:#F4EFE5;color:#2B251E}
.top.posata .langs{background:var(--surface-2)}
.top.posata .langs button{color:var(--ink-3)}
.top.posata .langs button[aria-current="true"]{background:var(--ink);color:var(--surface)}

/* ═══════════ apertura ═══════════ */
.hero{position:relative;z-index:1;max-width:var(--col);margin:0 auto;
  min-height:min(50svh,430px);display:flex;flex-direction:column;justify-content:flex-end;
  padding:90px var(--gut) 34px;color:#F7F3EA}
.benv{font-size:10px;letter-spacing:.34em;text-transform:uppercase;
  color:#F2DFB4;margin:0 0 14px;
  text-shadow:0 1px 3px rgba(26,23,19,.9),0 2px 14px rgba(26,23,19,.8)}
.hero h1{font-family:var(--disp);font-weight:400;font-size:clamp(38px,11vw,54px);
  line-height:1.04;letter-spacing:.015em;margin:0;text-wrap:balance;
  text-shadow:0 2px 28px rgba(0,0,0,.45)}
.hero .dove{margin:14px 0 0;font-size:12.5px;font-weight:500;color:rgba(247,243,234,.84);
  line-height:1.6;letter-spacing:.01em;text-shadow:0 1px 10px rgba(0,0,0,.6)}

/* ═══════════ il foglio ═══════════ */
.sheet{position:relative;z-index:1;max-width:var(--col);margin:0 auto;
  background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:26px 26px 0 0;
  box-shadow:0 -16px 54px rgba(0,0,0,.38);padding:6px var(--gut) 34px}
.maniglia{width:36px;height:4px;border-radius:99px;background:var(--hair);margin:10px auto 22px}

/* ═══════════ la fascia essenziale ═══════════ */
.essenziale{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair);
  border:1px solid var(--hair);border-radius:var(--tondo);overflow:hidden;margin-bottom:12px}
.essenziale > *{background:var(--surface);padding:15px 16px 14px;text-align:left;border:0}
.essenziale .k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-3);margin:0;font-weight:600}
.essenziale .v{font-family:var(--disp);font-size:27px;line-height:1.08;margin:7px 0 0;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.rete{grid-column:1/-1;display:flex;align-items:center;gap:13px;cursor:pointer;width:100%}
.rete .bollo{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:var(--gold-wash);
  display:grid;place-items:center}
.rete .bollo svg{width:18px;height:18px;stroke:var(--gold);stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.rete .testo{flex:1;min-width:0}
.rete .k{margin-bottom:3px}
.rete .pw{font-size:15px;font-weight:700;letter-spacing:.02em;color:var(--ink);
  display:block;line-height:1.25}
.rete .fai{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
  font-weight:700;white-space:nowrap}

/* ═══════════ le categorie ═══════════ */
.categorie{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{position:relative;display:block;border:0;padding:0;cursor:pointer;overflow:hidden;
  border-radius:var(--tondo);background:var(--surface-2);box-shadow:var(--morbida);
  transition:transform .22s cubic-bezier(.22,.61,.36,1)}
.cat:active{transform:scale(.985)}
.cat.larga{grid-column:1/-1}
.cat img{width:100%;aspect-ratio:1/1;object-fit:cover}
.cat.larga img{aspect-ratio:16/10}
.cat .vel{position:absolute;inset:0;
  background:linear-gradient(177deg,rgba(26,23,19,.04) 34%,rgba(26,23,19,.52) 72%,rgba(26,23,19,.84) 100%)}
.cat .lab{position:absolute;left:0;right:0;bottom:0;padding:13px 14px 14px;text-align:left;color:#F7F3EA}
.cat .nome{display:block;font-family:var(--disp);font-size:17px;line-height:1.18;
  letter-spacing:.012em}
.cat.larga .nome{font-size:21px}
.cat .sotto{display:block;font-size:11px;font-weight:500;color:rgba(247,243,234,.76);
  margin-top:4px;line-height:1.35;letter-spacing:.01em}
.cat .segno{position:absolute;top:12px;right:12px;width:27px;height:27px;border-radius:50%;
  background:rgba(247,243,234,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:grid;place-items:center}
.cat .segno svg{width:12px;height:12px;stroke:#F7F3EA;stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* le tessere col disegno: niente fotografia, un segno appena piu' chiaro del fondo */
.cat.disegnata{aspect-ratio:1/1;display:flex;flex-direction:column;padding:15px;
  background:var(--tessera);border:1px solid var(--tessera-filo);box-shadow:none}
.cat.disegnata .disegno{flex:1;width:100%;display:grid;place-items:center}
.cat.disegnata .disegno svg{width:60px;height:60px;stroke:var(--ico);stroke-width:1;
  fill:none;stroke-linecap:round;stroke-linejoin:round}
.cat.disegnata .lab{position:static;padding:0;width:100%;color:var(--tessera-ink)}
.cat.disegnata .nome{color:var(--tessera-ink);font-size:16px}
.cat.disegnata .sotto{color:var(--tessera-ink-2)}
.cat.disegnata .segno{background:var(--tessera-segno);backdrop-filter:none;-webkit-backdrop-filter:none}
.cat.disegnata .segno svg{stroke:var(--tessera-ink-2);width:12px;height:12px}

/* la scheda sobria delle emergenze */
.cat.sos{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:16px;
  background:var(--tessera);border:1px solid var(--tessera-filo);box-shadow:none}
.cat.sos .bollo{width:40px;height:40px;flex:0 0 40px;border-radius:50%;
  background:rgba(163,73,58,.14);display:grid;place-items:center}
.cat.sos .bollo svg{width:19px;height:19px;stroke:#A3493A;stroke-width:1.8;fill:none;
  stroke-linecap:round}
.cat.sos .lab{position:static;padding:0;color:var(--tessera-ink);flex:1}
.cat.sos .nome{font-size:16px;color:var(--tessera-ink)}
.cat.sos .sotto{color:var(--tessera-ink-2);font-variant-numeric:tabular-nums}
.cat.sos .segno{position:static;background:var(--tessera-segno)}
.cat.sos .segno svg{stroke:var(--tessera-ink-2)}

/* ═══════════ la finestra ═══════════ */
.velo{position:fixed;inset:0;z-index:60;background:rgba(18,15,11,.5);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .3s ease}
.velo.su{opacity:1}
/* Il pop-up resta pieno: appena un velo di vetro, niente fotografie dentro.
   La trasparenza vera sta nel foglio della pagina, non qui. */
.modale{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:var(--col);margin:0 auto;
  background:color-mix(in srgb,var(--surface) 95%,transparent);
  backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);
  overflow:hidden;border-radius:26px 26px 0 0;max-height:90svh;
  display:flex;flex-direction:column;box-shadow:0 -12px 56px rgba(0,0,0,.42);
  transform:translateY(102%);transition:transform .34s cubic-bezier(.22,.61,.36,1)}
.modale.su{transform:translateY(0)}
.modale-top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px var(--gut) 13px;border-bottom:1px solid var(--hair);flex:0 0 auto}
.modale-top h2{font-family:var(--disp);font-weight:400;font-size:21px;margin:0;
  letter-spacing:.012em;line-height:1.2}
.chiudi{width:32px;height:32px;border-radius:50%;border:0;background:var(--surface-2);
  color:var(--ink-2);display:grid;place-items:center;cursor:pointer;flex:0 0 32px}
.chiudi svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.modale-corpo{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px var(--gut) calc(28px + env(safe-area-inset-bottom,0))}
@media (prefers-reduced-motion:reduce){ .modale,.velo{transition:none} }

.dida{margin:0 0 16px;font-size:13px;color:var(--ink-3);line-height:1.6;max-width:44ch}
.occhiello{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
  font-weight:700;margin:26px 0 10px}
.occhiello:first-child{margin-top:0}

/* ═══════════ il video ═══════════ */
.cinema{border-radius:var(--tondo);overflow:hidden;box-shadow:var(--morbida);
  background:color-mix(in srgb,var(--shell) 85%,transparent)}
.cinema video{width:100%;aspect-ratio:9/16;max-height:62svh;object-fit:contain;
  background:transparent}
.sotto-video{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:11px;padding:0 2px}
.sotto-video .durata{font-size:11.5px;color:var(--ink-3);font-weight:500;letter-spacing:.01em}
.scarica{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
  letter-spacing:.04em;color:var(--gold);border:0;border-bottom:1px solid var(--gold);
  background:none;padding:0 0 3px;cursor:pointer}
.scarica[disabled]{opacity:.5;cursor:default}
.scarica svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* ═══════════ i passi, con le fotografie ═══════════ */
.passi{list-style:none;margin:0;padding:0;counter-reset:p}
.passi li{counter-increment:p;display:grid;grid-template-columns:66px 1fr;gap:14px;
  padding:14px 0;border-bottom:1px solid var(--hair-2);align-items:start}
.passi li:last-child{border-bottom:0;padding-bottom:0}
.passi .foto{position:relative;width:66px;height:66px;border-radius:14px;overflow:hidden;
  background:var(--surface-2)}
.passi .foto img{width:100%;height:100%;object-fit:cover}
.passi .foto i{position:absolute;left:0;bottom:0;width:21px;height:21px;
  background:var(--gold);color:#FBF8F3;font-style:normal;font-size:11px;font-weight:700;
  display:grid;place-items:center;border-radius:0 10px 0 14px}
.passi b{display:block;font-size:14.5px;font-weight:600;line-height:1.4}
.passi span{display:block;font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.6}
.passi mark{background:var(--gold-wash);color:var(--ink);font-weight:700;padding:1px 6px;
  border-radius:5px;white-space:nowrap}
.avviso{display:flex;gap:11px;align-items:flex-start;margin-top:18px;padding:14px 16px;
  background:var(--gold-wash);border-radius:16px;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.avviso svg{width:16px;height:16px;flex:0 0 16px;margin-top:3px;stroke:var(--gold);
  stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ═══════════ mappa ═══════════ */
.carta{position:relative;display:block;border-radius:var(--tondo);overflow:hidden;
  box-shadow:var(--morbida);background:var(--surface-2);margin-bottom:4px}
.carta img{width:100%;aspect-ratio:16/10;object-fit:cover}
.carta .ombra{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(26,23,19,0) 42%,rgba(26,23,19,.8) 100%)}
.carta .scritta{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;color:#F7F3EA;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.carta .via{font-family:var(--disp);font-size:17px;line-height:1.2}
.carta .zona{display:block;font-family:var(--ui);font-size:11px;font-weight:500;
  opacity:.8;margin-top:3px}
.carta .vai{flex:0 0 auto;display:flex;align-items:center;gap:5px;font-size:9.5px;
  font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-lit);padding-bottom:3px}
.carta .vai svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* ═══════════ righe ═══════════ */
.riga{display:flex;align-items:center;gap:14px;padding:12px 0;
  border-bottom:1px solid var(--hair-2);width:100%}
.riga:last-child{border-bottom:0}
.riga:active{opacity:.6}
.riga .fig{width:50px;height:50px;flex:0 0 50px;border-radius:13px;object-fit:cover;
  background:var(--surface-2)}
.riga .ico{width:50px;height:50px;flex:0 0 50px;border-radius:13px;background:var(--gold-wash);
  display:grid;place-items:center}
.riga .ico svg{width:20px;height:20px;stroke:var(--gold);stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.riga .corpo{flex:1;min-width:0}
.riga .nome{display:block;font-size:14.5px;font-weight:600;line-height:1.35;color:var(--ink)}
.riga .nota{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.45}
.riga .vai{flex:0 0 auto;display:flex;align-items:center;gap:5px;font-size:9.5px;
  font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.riga .vai svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* ═══════════ wi-fi dentro la casa ═══════════ */
.wifi{background:var(--wifi-bg);color:var(--wifi-fg);border-radius:var(--tondo);
  padding:18px;box-shadow:var(--morbida)}
.wifi dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:baseline}
.wifi dt{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;
  white-space:nowrap;font-weight:600}
.wifi dd{margin:0;font-size:15.5px;font-weight:700;text-align:right;word-break:break-all}
.copia{margin-top:16px;width:100%;padding:12px;border-radius:12px;cursor:pointer;
  background:var(--gold-lit);color:#2B251E;border:0;font-size:13px;font-weight:700;
  letter-spacing:.03em;transition:transform .16s ease}
.copia:active{transform:scale(.985)}
.copia[data-fatto="1"]{background:var(--sage);color:#FBF8F3}

.dot{display:flex;flex-wrap:wrap;gap:7px}
.dot span{font-size:12px;font-weight:500;color:var(--ink-2);background:var(--surface-2);
  padding:7px 13px;border-radius:999px;line-height:1.3}

.regole{list-style:none;margin:0;padding:0;counter-reset:r}
.regole li{counter-increment:r;display:grid;grid-template-columns:22px 1fr;gap:13px;
  padding:14px 0;border-bottom:1px solid var(--hair-2)}
.regole li:last-child{border-bottom:0;padding-bottom:0}
.regole li::before{content:counter(r,decimal-leading-zero);font-size:10.5px;font-weight:700;
  color:var(--gold);padding-top:4px;font-variant-numeric:tabular-nums}
/* il numero sta nella prima colonna, titolo e testo nella seconda:
   senza grid-column il testo finiva nella colonna da 22 px, una parola per riga */
.regole b{grid-column:2;display:block;font-size:14px;font-weight:600;line-height:1.4}
.regole li > span{grid-column:2;display:block;font-size:12.5px;color:var(--ink-2);
  margin-top:3px;line-height:1.6}

.sos-n{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:6px}
.sos-n a{background:var(--surface-2);border-radius:15px;padding:14px 15px}
.sos-n .n{display:block;font-family:var(--disp);font-size:25px;line-height:1;
  color:var(--terra);font-variant-numeric:tabular-nums}
.sos-n .w{display:block;font-size:11px;color:var(--ink-2);margin-top:6px;line-height:1.4}

/* ═══════════ chiusura ═══════════ */
.fine{margin-top:26px;padding:30px 22px 26px;background:var(--surface-2);
  border-radius:var(--tondo);text-align:center}

/* ═══════════ costruzione ═══════════ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let L = "it";
let salvataggio = null;

function riga(href, fig, nome, nota, vai){
  const sinistra = fig.startsWith("ico:")
    ? '<span class="ico">'+sv(I[fig.slice(4)])+'</span>'
    : '<img class="fig" src="img/'+fig+'.jpg" alt="" loading="lazy" width="50" height="50">';
  const fuori = href.startsWith("tel:") ? "" : ' target="_blank" rel="noopener"';
  return '<a class="riga" href="'+href+'"'+fuori+'>'+sinistra+
    '<span class="corpo"><span class="nome">'+esc(nome)+'</span>'+
    (nota ? '<span class="nota">'+esc(nota)+'</span>' : '')+'</span>'+
    '<span class="vai">'+esc(vai)+sv(I.freccia)+'</span></a>';
}

/* ─── cosa c'è dentro ogni categoria ─── */
function dentro(chiave){
  const t = T[L], km = k => t.dist(D[k][0], D[k][1]), z = t.z;

  if (chiave === "ingresso") return '<p class="dida">'+esc(t.ing.vD)+'</p>'+
    '<div class="cinema"><video controls playsinline preload="metadata" '+
      'poster="img/video-poster.jpg" src="'+U.video+'"></video></div>'+
    '<div class="sotto-video"><span class="durata">'+esc(t.ing.durata)+'</span>'+
      '<button class="scarica" type="button" id="scarica">'+sv(I.giu)+esc(t.ing.scarica)+'</button></div>'+
    '<p class="occhiello">'+esc(t.ing.pT)+'</p>'+
    '<p class="dida">'+esc(t.ing.pD)+'</p>'+
    '<ol class="passi">'+t.ing.passi.map((p,i)=>
      '<li><span class="foto"><img src="img/'+PASSI_FOTO[i]+'.jpg" alt="" loading="lazy">'+
      '<i>'+(i+1)+'</i></span><span><b>'+esc(p[0])+'</b><span>'+p[1]+'</span></span></li>').join("")+'</ol>'+
    '<div class="avviso">'+sv(I.avviso)+'<span>'+esc(t.ing.avviso)+'</span></div>';

  if (chiave === "arrivare") return '<p class="dida">'+esc(t.arr.d)+'</p>'+
    '<a class="carta" href="'+U.casa+'" target="_blank" rel="noopener">'+
      '<img src="img/mappa-larga.jpg" alt="" loading="lazy" width="650" height="406">'+
      '<span class="ombra"></span><span class="scritta">'+
      '<span class="via">Via delle Rande 6<span class="zona">'+esc(t.zona)+'</span></span>'+
      '<span class="vai">'+esc(t.vai.mappa)+sv(I.freccia)+'</span></span></a>'+
    '<div>'+t.arr.v.map(v=>riga(U.dir(v[3],v[4]),"ico:"+v[2],v[0],v[1],t.vai.percorso)).join("")+
      riga(U.cerca("Stazione Stella Polare Ostia"),"ico:treno",t.arr.staz[0],t.arr.staz[1]+" · "+km("stazione"),t.vai.mappa)+
      riga(U.taxiTel,"taxi",t.arr.taxi[0],t.arr.taxi[1],t.vai.chiama)+'</div>';

  if (chiave === "casa") return '<div class="wifi"><dl>'+
      '<dt>'+esc(t.rete)+'</dt><dd>'+esc(WIFI.rete)+'</dd>'+
      '<dt>Password</dt><dd id="pw">'+esc(WIFI.pw)+'</dd></dl>'+
      '<button class="copia" id="copia" type="button" data-a="'+esc(t.copia)+'" data-b="'+esc(t.copiata)+'">'+esc(t.copia)+'</button></div>'+
    '<p class="occhiello">'+esc(t.cs.dT)+'</p>'+
    '<div class="dot">'+t.cs.dot.map(d=>'<span>'+esc(d)+'</span>').join("")+'</div>'+
    '<p class="occhiello">'+esc(t.cs.rT)+'</p>'+
    '<ol class="regole">'+t.cs.regole.map(r=>'<li><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></li>').join("")+'</ol>';

  if (chiave === "vedere") return '<div>'+
    riga(U.dir("Lungomare Duca degli Abruzzi, Lido di Ostia","walking"),"ico:mare",z.mare[0],z.mare[1]+" · "+km("mare"),t.vai.percorso)+
    riga(U.pontile,"pontile",z.pontile[0],z.pontile[1]+" · "+km("pontile"),t.vai.mappa)+
    riga(U.anco,"anco-marzio",z.anco[0],z.anco[1]+" · "+km("anco"),t.vai.mappa)+
    riga(U.scavi,"ostia-antica",z.scavi[0],z.scavi[1],t.vai.mappa)+'</div>';

  if (chiave === "spesa") return '<div>'+
    riga(U.conad,"conad",z.conad[0],z.conad[1]+" · "+km("conad"),t.vai.mappa)+
    riga(U.farmacia,"farmacia",z.farmacia[0],z.farmacia[1]+" · "+km("farmacia"),t.vai.mappa)+
    riga(U.taxiTel,"taxi",z.taxi[0],z.taxi[1],t.vai.chiama)+'</div>';

  if (chiave === "mangiare") return '<div>'+
    riga(U.sagona,"sagona",z.sagona[0],z.sagona[1]+" · "+km("sagona"),t.vai.mappa)+
    riga(U.traiano,"antico-traiano",z.traiano[0],z.traiano[1]+" · "+km("traiano"),t.vai.mappa)+
    riga(U.mit,"mit-bistrot",z.mit[0],z.mit[1]+" · "+km("mit"),t.vai.mappa)+'</div>';

  if (chiave === "partire") return '<p class="dida">'+esc(t.p.d)+'</p><ol class="regole">'+
    t.p.l.map(x=>'<li><b>'+esc(x)+'</b></li>').join("")+'</ol>';

  if (chiave === "sos") return '<p class="dida">'+esc(t.s.d)+'</p>'+
    '<div class="sos-n">'+t.s.n.map(n=>'<a href="tel:'+n[0]+'"><span class="n">'+n[0]+'</span><span class="w">'+esc(n[1])+'</span></a>').join("")+'</div>'+
    '<div style="margin-top:12px">'+
      riga(U.cerca("Ospedale Giovanni Battista Grassi Ostia"),"ico:croce",t.s.ps[0],t.s.ps[1],t.vai.mappa)+
      riga(U.farmacia,"farmacia",t.s.farmacia[0],t.s.farmacia[1]+" · "+km("farmacia"),t.vai.mappa)+'</div>';
  return "";
}

function tessera(chiave, larga){
  const c = T[L].cat[chiave];
  return '<button class="cat'+(larga?" larga":"")+'" type="button" data-apre="'+chiave+'">'+
    '<img src="img/'+FOTO[chiave]+'.jpg" alt="" loading="lazy">'+
    '<span class="vel"></span><span class="segno">'+sv(I.freccia)+'</span>'+
    '<span class="lab"><span class="nome">'+esc(c[0])+'</span>'+
    '<span class="sotto">'+esc(c[1])+'</span></span></button>';
}

function tesseraDisegno(chiave){
  const c = T[L].cat[chiave];
  return '<button class="cat disegnata" type="button" data-apre="'+chiave+'">'+
    '<span class="segno">'+sv(I.freccia)+'</span>'+
    '<span class="disegno">'+sv(I[DISEGNO[chiave]])+'</span>'+
    '<span class="lab"><span class="nome">'+esc(c[0])+'</span>'+
    '<span class="sotto">'+esc(c[1])+'</span></span></button>';
}

function costruisci(lang){
  L = lang;
  const t = T[lang];

  document.getElementById("app").innerHTML =
    '<div class="essenziale">'+
      '<div><p class="k">'+esc(t.ci)+' · '+esc(t.da)+'</p><p class="v">15:00</p></div>'+
      '<div><p class="k">'+esc(t.co)+' · '+esc(t.entro)+'</p><p class="v">10:00</p></div>'+
      '<button class="rete" type="button" id="rete">'+
        '<span class="bollo">'+sv(I.wifi)+'</span>'+
        '<span class="testo"><p class="k">'+esc(t.rete)+' · '+esc(WIFI.rete)+'</p>'+
        '<span class="pw" id="pw-breve">'+esc(WIFI.pw)+'</span></span>'+
        '<span class="fai" id="rete-fai">'+esc(t.copia)+'</span></button>'+
    '</div>'+
    '<div class="categorie">'+
      tessera("ingresso", true)+
      tesseraDisegno("arrivare")+tesseraDisegno("casa")+
      tesseraDisegno("vedere")+tesseraDisegno("spesa")+
      tesseraDisegno("mangiare")+tesseraDisegno("partire")+
      '<button class="cat sos" type="button" data-apre="sos">'+
        '<span class="bollo">'+sv(I.croce)+'</span>'+
        '<span class="lab"><span class="nome">'+esc(t.cat.sos[0])+'</span>'+
        '<span class="sotto">'+esc(t.cat.sos[1])+'</span></span>'+
        '<span class="segno">'+sv(I.freccia)+'</span></button>'+
    '</div>'+
    '<div class="fine"><h2>'+esc(t.f.t)+'</h2><p>'+esc(t.f.p)+'</p>'+
      '<a class="azione" href="'+U.wa+encodeURIComponent(t.f.msg)+'" target="_blank" rel="noopener">'+
        sv(I.chat)+esc(t.f.cta)+'</a>'+
      '<a class="stelle" href="'+U.recensione+'" target="_blank" rel="noopener">'+
        '<i>★★★★★</i>'+esc(t.f.rec)+'</a></div>';

  /* barra bassa: quattro azioni, non quattro sezioni */
  document.getElementById("tabs").innerHTML =
    '<button class="tab" type="button" data-apre="ingresso">'+sv(I.chiave)+'<span>'+esc(t.tabs[0])+'</span></button>'+
    '<button class="tab" type="button" data-apre="casa">'+sv(I.wifi)+'<span>'+esc(t.tabs[1])+'</span></button>'+
    '<a class="tab" href="'+U.casa+'" target="_blank" rel="noopener">'+sv(I.mappa)+'<span>'+esc(t.tabs[2])+'</span></a>'+
    '<a class="tab" href="'+U.wa+encodeURIComponent(t.f.msg)+'" target="_blank" rel="noopener">'+sv(I.chat)+'<span>'+esc(t.tabs[3])+'</span></a>';

  document.getElementById("h-benv").textContent = t.benv;
  document.getElementById("h-dove").innerHTML = t.dove;
  document.getElementById("foot").textContent = t.foot;
  document.documentElement.lang = lang;
  document.querySelectorAll("#langs button").forEach(b =>
    b.setAttribute("aria-current", b.dataset.l === lang ? "true" : "false"));

  document.getElementById("rete").addEventListener("click", () => {
    copiaPassword(document.getElementById("rete-fai"), t.copiata, t.copia);
  });
}

async function copiaPassword(dove, fatto, prima){
  try { await navigator.clipboard.writeText(WIFI.pw); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = WIFI.pw; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (_) {}
    ta.remove();
  }
  if (!dove) return;
  const era = dove.tagName === "BUTTON" ? dove.textContent : dove.textContent;
  dove.textContent = fatto; dove.dataset.fatto = "1";
  setTimeout(() => { dove.textContent = prima; dove.dataset.fatto = ""; }, 2200);
}

/* ═══════════ la finestra ═══════════ */
const velo = document.getElementById("velo");
const modale = document.getElementById("modale");
const corpo = document.getElementById("modale-corpo");
const titolo = document.getElementById("modale-tit");
let tornaA = null;

function apri(chiave){
  const voce = T[L].cat[chiave];
  if (!voce) return;
  tornaA = document.activeElement;
  titolo.textContent = voce[0];
  corpo.innerHTML = dentro(chiave);
  corpo.scrollTop = 0;
  velo.hidden = false; modale.hidden = false;
  document.body.classList.add("fermo");
  requestAnimationFrame(() => { velo.classList.add("su"); modale.classList.add("su"); });
  document.getElementById("chiudi").focus();

  const b = corpo.querySelector("#copia");
  if (b) b.addEventListener("click", () => copiaPassword(b, b.dataset.b, b.dataset.a));

  const giu = corpo.querySelector("#scarica");
  if (giu) giu.addEventListener("click", async () => {
    giu.disabled = true; const era = giu.innerHTML; giu.innerHTML = sv(I.giu)+"…";
    try {
      if (salvataggio) {
        const blob = await (await fetch(U.video)).blob();
        await salvataggio.save({ filename:"rome-smart-sea-guida-accesso.mp4", data: blob });
      } else {
        /* Fuori da claude.ai (per esempio su GitHub Pages) il file sta sullo stesso
           indirizzo: basta un collegamento con `download` e il telefono lo salva. */
        const a = document.createElement("a");
        a.href = U.video; a.download = "rome-smart-sea-guida-accesso.mp4";
        document.body.appendChild(a); a.click(); a.remove();
      }
    } catch (e) { /* ha detto di no, o non si può: si torna com'era */ }
    giu.innerHTML = era; giu.disabled = false;
  });
}
function chiudi(){
  const v = corpo.querySelector("video"); if (v) v.pause();
  velo.classList.remove("su"); modale.classList.remove("su");
  document.body.classList.remove("fermo");
  setTimeout(() => { velo.hidden = true; modale.hidden = true; corpo.innerHTML = ""; }, 340);
  if (tornaA && tornaA.focus) tornaA.focus();
}
velo.addEventListener("click", chiudi);
document.getElementById("chiudi").addEventListener("click", chiudi);
addEventListener("keydown", e => { if (e.key === "Escape" && !modale.hidden) chiudi(); });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-apre]");
  if (b) { e.preventDefault(); apri(b.dataset.apre); }
});

/* ═══════════ lingue e barra ═══════════ */
const ordine = ["it","en","es","fr","de"];
document.getElementById("langs").innerHTML = ordine.map(l =>
  '<button type="button" data-l="'+l+'" title="'+T[l].lingua+'">'+T[l].nome+'</button>').join("");
document.getElementById("langs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  try { localStorage.setItem("rss-lingua", b.dataset.l); } catch (_) {}
  if (!modale.hidden) chiudi();
  costruisci(b.dataset.l);
  window.scrollTo({ top: 0, behavior: "smooth" });
});

const barraAlta = document.getElementById("top");
const posa = () => barraAlta.classList.toggle("posata", scrollY > 40);
addEventListener("scroll", posa, { passive: true });

if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("downloads").then(d => { salvataggio = d; }).catch(() => {});
}

let avvio = "it";
try {
  const salvata = localStorage.getItem("rss-lingua");
  if (salvata && T[salvata]) avvio = salvata;
  else { const n = (navigator.language || "it").slice(0,2).toLowerCase(); if (T[n]) avvio = n; }
} catch (_) {
  const n = (navigator.language || "it").slice(0,2).toLowerCase(); if (T[n]) avvio = n;
}
costruisci(avvio);
posa();
</script>
